# Must be explicit and match requires-python: `ruff --config ruff.toml`
# does not read requires-python.  ./test checks this.
target-version = "py312"

[lint]
# Specify which groups of lint rules to use.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "D",   # pydocstyle
    "I",   # isort
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "PT",  # flake8-pytest-style
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "PL",  # pylint subset
    "RET", # flake8-return
    "C4",  # flake8-comprehensions
    "ARG", # flake8-unused-arguments
]
# Ignore specific rule violations.  See https://docs.astral.sh/ruff/rules.
ignore = [
    # Disable the following two rules because they conflict with other rules.
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D213",  # multi-line-summary-second-line (conflicts with D212)

    # Disable the following rules because they're made redundant by the formatter.
    "W191",  # tab-indentation
    "E111",  # indentation-with-invalid-multiple
    "E114",  # indentation-with-invalid-multiple-comment
    "E117",  # over-indented
    "D206",  # indent-with-spaces
    "D300",  # triple-single-quotes
]

[lint.pydocstyle]
convention = "pep257"

[lint.per-file-ignores]
# Side-effect imports for Flask route registration are the rule, not the
# exception, in package __init__.py files.  Ignore F401 (unused-import) there.
"__init__.py" = ["F401"]
# HTTP status codes and similar magic numbers in test assertions are
# idiomatic, not a code smell.  Ignore PLR2004 in test files.
"test_*.py" = ["PLR2004"]
"conftest.py" = ["PLR2004"]
